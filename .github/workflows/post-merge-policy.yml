name: Post-merge Policy

on:
  pull_request_target:
    types:
      - closed

permissions:
  contents: read

jobs:
  reachability:
    if: github.event.pull_request.merged == true
    name: Main Reachability
    runs-on: ubuntu-latest
    steps:
      - name: Checkout default branch
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - name: Verify merge reached the default branch
        run: |
          python3 scripts/pr_policy.py post-merge \
            --event "$GITHUB_EVENT_PATH" \
            --config .github/pr-policy.json \
            --repository-path . \
            --output post-merge-policy-report.json
