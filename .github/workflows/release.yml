name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-14
          - target: x86_64-apple-darwin
            runner: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Verify tag matches Cargo version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          cargo_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          test -n "$tag_version" && test "$tag_version" = "$cargo_version"
      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}
      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package archive
        shell: bash
        run: |
          archive="ai-dev-orchestrator-${GITHUB_REF_NAME#v}-${{ matrix.target }}.tar.gz"
          staging="package/${{ matrix.target }}"
          mkdir -p "$staging"
          cp "target/${{ matrix.target }}/release/ai-dev-orchestrator" "$staging/"
          cp README.md LICENSE "$staging/"
          tar -C package -czf "$archive" "${{ matrix.target }}"
          shasum -a 256 "$archive" | awk '{print $1 "  " $2}' > "${archive}.sha256"
      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.target }}
          path: |
            ai-dev-orchestrator-*.tar.gz
            ai-dev-orchestrator-*.tar.gz.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          merge-multiple: true
      - name: Verify checksums and create manifest
        shell: bash
        run: |
          shasum -a 256 -c ai-dev-orchestrator-*.tar.gz.sha256
          cat ai-dev-orchestrator-*.tar.gz.sha256 > SHA256SUMS
      - name: Create release and upload archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes ai-dev-orchestrator-*.tar.gz SHA256SUMS
