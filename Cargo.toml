[package]
name = "ai-dev-orchestrator"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[[bin]]
name = "ai-dev-orchestrator"
path = "src/main.rs"

[dependencies]
fs2 = "0.4"
libc = "0.2"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
toml = "0.8"

[workspace]
resolver = "3"
